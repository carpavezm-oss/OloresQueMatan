<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Olores que Matan</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="../estilos/style.css">

</head>

<body>

    <main>

        <section class="section login-pagina">

            <div class="container">

                <div class="has-text-centered mb-5">

                    <a class="login-home" href="../index.html">
                        ← Volver al inicio
                    </a>

                    <div class="login-logo">
                        OlORES QUE MATAN
                    </div>

                </div>

                <div class="columns is-centered">

                    <div class="column is-5">

                        <form
                            class="formulario login-formulario"
                            onsubmit="validarFormularioLogin(event)">

                            <h1 class="title is-3 has-text-centered">
                                Iniciar sesión
                            </h1>

                            <div class="field">

                                <label class="label" for="correo">
                                    Correo
                                </label>

                                <div class="control">

                                    <input
                                        class="input"
                                        id="correo"
                                        name="correo"
                                        type="email"
                                        maxlength="100"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="field">

                                <label class="label" for="password">
                                    Contraseña
                                </label>

                                <div class="control">

                                    <input
                                        class="input"
                                        id="password"
                                        name="password"
                                        type="password"
                                        minlength="4"
                                        maxlength="10"
                                        required
                                    >

                                </div>

                            </div>

                            <div class="field">

                                <div class="control">

                                    <button
                                        class="button login-boton"
                                        type="submit">
                                        Ingresar
                                    </button>

                                </div>

                            </div>

                            <p class="has-text-centered login-registro">

                                ¿No tienes cuenta?

                                <a href="registro.html">
                                    Regístrate
                                </a>

                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Olores que Matan</p>
    </footer>

    <script src="../scripts/validaciones.js"></script>

</body>

</html>
